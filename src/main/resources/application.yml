spring:

  main:
    allow-bean-definition-overriding: true
  application:
    name: Vinyler-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/vinyler
    driver-class-name: org.postgresql.Driver
    username: vinyler-master
    password: itsfrom90s

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate # 스키마 변경은 Flyway가 전담, Hibernate는 엔티티-스키마 일치 여부만 검증
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true # Flyway 이력이 없는 기존 DB를 baseline으로 간주하고 그 이후 마이그레이션만 적용

  elasticsearch:
    uris: http://localhost:9200

springdoc:
  swagger-ui:
    groups-order: desc
    tags-sorter: alpha
    operations-sorter: method
    disable-swagger-default-url: true
    default-models-expand-depth: 2
    default-model-expand-depth: 2
  api-docs:
    path: /api-docs
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  model-and-view-allowed: true
  paths-to-match:
    - /api/v1/**


logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.web.authentication: DEBUG  # 인증 관련
    org.springframework.security.web.access: DEBUG         # 인가(Authorization) 관련
    org.springframework.security.jwt: DEBUG                # JWT 관련


jwt:
  secret-key: dmlueWxlci1zY2FuLWl0LXJpZ2h0YXdheQo=
  token:
    access-expiration-time: 10800000 # 3시간
    refresh-expiration-time: 604800000 # 7일

data:
  redis:
    host: localhost # 로컬 테스트 시
    port: 6379
    password: systempass


